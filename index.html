<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1a3a">
<title>The Wizard's Tower</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1b1a3a;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
body{background:radial-gradient(ellipse at 50% 0%,#3a2f7a 0%,#1b1a3a 60%,#12112a 100%) fixed;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px)}
button{font:inherit;color:#fff;border:0;border-radius:999px;background:rgba(255,255,255,.14);padding:10px 22px;font-size:16px;cursor:pointer}
button:active{background:rgba(255,255,255,.28)}
#hud{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between}
#pips{display:flex;gap:10px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);transition:all .4s}
.pip.now{border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.8)}
.pip.done{background:#ffd23f;border-color:#ffd23f}
#mute{padding:6px 12px;font-size:18px;background:rgba(255,255,255,.1)}
#mute.off{opacity:.4;text-decoration:line-through}
h1{margin:14px 0 4px;text-align:center;font-size:clamp(22px,6.5vw,32px);text-shadow:0 2px 12px rgba(255,170,40,.5)}
#sub{margin:0 0 10px;text-align:center;max-width:380px;font-size:clamp(14px,4vw,16px);opacity:.85;min-height:2.6em}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px}
#controls{display:flex;gap:10px;padding-top:14px;flex-wrap:wrap;justify-content:center}

/* level 1: potions */
.tubes{display:flex;flex-wrap:wrap;gap:26px 18px;justify-content:center;max-width:270px;--seg:40px;padding-top:16px}
.tube{width:62px;height:calc(var(--seg)*4 + 8px);border:3px solid rgba(255,255,255,.55);border-top:none;border-radius:4px 4px 30px 30px;
  padding:0 3px 4px;display:flex;flex-direction:column-reverse;background:rgba(255,255,255,.07);cursor:pointer;transition:transform .15s,box-shadow .2s}
.tube.sel{transform:translateY(-16px);border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.6)}
.tube.done{border-color:#7be07b;box-shadow:0 0 14px rgba(123,224,123,.5)}
.seg{height:var(--seg);display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(0,0,0,.35)}
.seg:first-child{border-radius:2px 2px 24px 24px}

/* level 2: runes */
.runes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(82vw,340px)}
.rune{aspect-ratio:1;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:#2a2858;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .25s,box-shadow .25s}
.rune svg{width:60%;height:60%;stroke:#6e6aa8;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.rune.on{background:radial-gradient(circle,#ffe68a,#ff9a3c);border-color:#ffe68a;box-shadow:0 0 18px rgba(255,170,40,.7)}
.rune.on svg{stroke:#5a2a00}
.rune.hint{animation:pulse .6s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.14);border-color:#fff}}

/* level 3: riddles */
#door{width:min(44vw,170px);height:auto;display:block;margin:0 auto 6px}
#door .panel{transition:transform 1s ease-in}
#door.open #pl{transform:translateX(-38px)}
#door.open #pr{transform:translateX(38px)}
#door.open #glow{opacity:1}
#glow{opacity:.25;transition:opacity 1s}
.riddle{margin:0 0 14px;text-align:center;font-size:clamp(16px,4.6vw,19px);line-height:1.4;max-width:360px}
.riddle small{display:block;opacity:.65;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;font-size:12px}
.slots{display:flex;gap:6px;justify-content:center;margin-bottom:16px;min-height:42px}
.slot{width:clamp(26px,9.5vw,38px);height:42px;border-bottom:3px solid #ffd23f;font-size:26px;font-weight:700;text-align:center;line-height:40px;cursor:pointer}
.slot.locked{color:#7be7ff;cursor:default}
.slot.ok{color:#7be07b;border-color:#7be07b}
.slots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px}
.tile{width:44px;height:44px;border-radius:12px;background:#3a2f7a;border:2px solid rgba(255,255,255,.35);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tile.used{opacity:.18;pointer-events:none}

/* slide puzzle */
.slide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(80vw,300px);aspect-ratio:1}
.stone{border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,9vw,40px);font-weight:800;color:#2a1a00;cursor:pointer;
  background:linear-gradient(145deg,#ffe68a,#ff9a3c);border:2px solid #ffe68a;box-shadow:0 0 12px rgba(255,170,40,.4)}
.stone.gap{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.2);box-shadow:none;cursor:default}
.stone.ok{background:linear-gradient(145deg,#b6f5b6,#3fbf6a);border-color:#b6f5b6;box-shadow:0 0 12px rgba(123,224,123,.5)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(88vw,340px)}
.mcard{aspect-ratio:3/4;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,9vw,40px);cursor:pointer;
  background:repeating-linear-gradient(45deg,#3a2f7a,#3a2f7a 8px,#2a2858 8px,#2a2858 16px);border:2px solid rgba(255,255,255,.3);color:transparent;transition:transform .25s}
.mcard.up{background:#fff3d6;border-color:#ffd23f;color:var(--c,#b8325f)}
.mcard.done{background:#d8f5d8;border-color:#7be07b;color:var(--c,#2a7a3a);cursor:default}

/* crystals */
.crys{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(70vw,280px)}
.crystal{aspect-ratio:1;border-radius:26%;display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(0,0,0,.35);cursor:pointer;opacity:.4;transition:opacity .15s,box-shadow .15s}
.crystal.lit{opacity:1;box-shadow:0 0 30px 6px var(--c)}
.status{margin:0 0 16px;font-size:18px;min-height:1.4em;text-align:center}

/* mana pipes */
.pipes{display:grid;width:min(94vw,420px);gap:4px}
.pcell{aspect-ratio:1;border-radius:10px;background:rgba(255,255,255,.07);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pcell{color:#6e6aa8}
.pcell.lit{color:#ffd23f}
.pcell svg{width:100%;height:100%;transition:transform .2s}
.pcell path{stroke:#6e6aa8;stroke-width:22;fill:none;stroke-linecap:butt}
.pcell.lit path{stroke:#ffd23f}
.pcell.lit{background:rgba(255,210,63,.12)}
.pend{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px;color:#6e6aa8;transition:color .3s,text-shadow .3s}
.pend.lit{color:#ffd23f;text-shadow:0 0 14px #ffb000}

/* cards */
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,30,.6);opacity:0;pointer-events:none;transition:opacity .5s;z-index:5}
#card.show{opacity:1;pointer-events:auto}
#cardbox{background:#17153a;border:2px solid rgba(255,200,90,.7);border-radius:28px;padding:26px 22px;margin:0 20px;max-width:360px;text-align:center;
  box-shadow:0 0 40px rgba(255,170,40,.45);transform:scale(.6);transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
#card.show #cardbox{transform:scale(1)}
#cardbox svg{width:min(50vw,190px);height:auto;display:block;margin:0 auto 6px}
#cardbox h2{margin:6px 0 10px;font-size:clamp(26px,8vw,38px);line-height:1.15;
  background:linear-gradient(90deg,#ffd23f,#ff6fa5,#4cc3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#cardbox p{margin:0 0 18px;font-size:16px;line-height:1.45;opacity:.9}
#cardbtn{background:linear-gradient(90deg,#ff9a3c,#ff6fa5);font-weight:700;font-size:18px;padding:12px 28px}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards;z-index:6;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="hud"><div id="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div><button id="mute" aria-label="Sound">♪</button></div>
<h1 id="title"></h1>
<p id="sub"></p>
<div id="stage"></div>
<div id="controls"></div>
<div id="card"><div id="cardbox"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
const stage=$('#stage'),titleEl=$('#title'),subEl=$('#sub'),ctrl=$('#controls'),card=$('#card'),cardBox=$('#cardbox');
const pips=[...document.querySelectorAll('.pip')];
let level=0,muted=false,actx=null,keyHandler=null;

/* ---------- sound ---------- */
function tone(f,d=.12,type='sine',when=0,vol=.08){
  if(muted)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={
  tap:()=>tone(520,.08),
  pour:()=>tone(330,.15,'triangle'),
  bad:()=>tone(160,.25,'sawtooth'),
  good:()=>[523,659,784].forEach((f,i)=>tone(f,.25,'sine',i*.1)),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',i*.12))
};
$('#mute').onclick=e=>{muted=!muted;e.currentTarget.classList.toggle('off',muted);};
addEventListener('keydown',e=>{if(keyHandler)keyHandler(e);});

/* ---------- cards & flow ---------- */
function showCard({svg='',head,text,btn,fn}){
  cardBox.innerHTML=svg;
  cardBox.appendChild(h('h2','',head));
  cardBox.appendChild(h('p','',text));
  const b=h('button','',btn);b.id='cardbtn';
  b.onclick=()=>{card.classList.remove('show');sfx.tap();setTimeout(fn,350);};
  cardBox.appendChild(b);
  card.classList.add('show');
}
function confetti(){
  const cols=['#ffd23f','#ff6fa5','#4cc3ff','#7be07b','#ff9a3c'];
  for(let i=0;i<46;i++){
    const c=h('i','conf');
    c.style.left=rnd(100)+'vw';c.style.background=cols[rnd(cols.length)];
    c.style.animationDuration=(2.5+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),7000);
  }
}
const HAT=`<svg viewBox="0 0 200 180" role="img" aria-label="Wizard hat">
<ellipse cx="100" cy="152" rx="88" ry="15" fill="#3a2f7a"/>
<path d="M50 150Q68 92 92 24Q104 10 112 28Q132 92 150 150Q100 164 50 150z" fill="#5547c9"/>
<path d="M56 132Q100 146 144 132L150 150Q100 164 50 150z" fill="#ffd23f"/>
<polygon points="100,70 105,84 120,85 108,94 112,108 100,100 88,108 92,94 80,85 95,84" fill="#ffd23f"/>
<circle cx="64" cy="60" r="3" fill="#fff" opacity=".7"/><circle cx="140" cy="86" r="2.5" fill="#fff" opacity=".7"/><circle cx="118" cy="44" r="2" fill="#fff" opacity=".7"/>
</svg>`;
const KEY=`<svg viewBox="0 0 200 120" role="img" aria-label="Golden key">
<circle cx="52" cy="60" r="34" fill="none" stroke="#ffd23f" stroke-width="14"/>
<path d="M84 60H186M150 60v26M174 60v20" stroke="#ffd23f" stroke-width="14" stroke-linecap="round" fill="none"/>
</svg>`;

let epoch=0,run=[];
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
function startRun(){
  /* three different trials per run, avoiding the ones used last time */
  const last=store.get('wt_types',[]);
  const ids=shuffle(TYPES.map((_,i)=>i));
  ids.sort((a,b)=>(last.includes(a)?1:0)-(last.includes(b)?1:0));
  const pick=ids.slice(0,3);
  store.set('wt_types',pick);
  run=pick.map(i=>TYPES[i]);
  startLevel(0);
}
function startLevel(n){
  level=n;epoch++;keyHandler=null;stage.textContent='';ctrl.textContent='';
  pips.forEach((p,i)=>p.className='pip'+(i<n?' done':i===n?' now':''));
  const T=run[n];titleEl.textContent=`Trial ${n+1}: ${T.name}`;subEl.textContent=T.sub;T.start();
}
function complete(){
  keyHandler=null;pips[level].className='pip done';
  if(level<2){
    sfx.good();
    showCard({svg:KEY,head:`Trial ${level+1} passed!`,text:level===0?'A secret door swings open. Up the stairs you go!':'The magic hums louder. One trial left!',btn:'Next trial',fn:()=>startLevel(level+1)});
  }else{
    sfx.win();confetti();
    showCard({svg:HAT,head:'You did it!',text:'The Tower is free and the golden hat is yours. You are a Master Wizard!',btn:'Play again',fn:startRun});
  }
}
function btn(label,fn){const b=h('button','',label);b.onclick=fn;ctrl.appendChild(b);return b;}

/* ---------- level 1: potions ---------- */
const COLS=[{c:'#e5484d',g:'●'},{c:'#3e8ef7',g:'▲'},{c:'#3fbf6a',g:'■'},{c:'#f5c542',g:'★'}];
const CAP=4;
const canPour=(a,b)=>a.length>0&&b.length<CAP&&(!b.length||b[b.length-1]===a[a.length-1]);
function pour(tubes,i,j){const a=tubes[i],b=tubes[j],c=a[a.length-1];while(a.length&&a[a.length-1]===c&&b.length<CAP)b.push(a.pop());}
const isFull=t=>t.length===CAP&&t.every(x=>x===t[0]);
const isSolved=ts=>ts.every(t=>!t.length||isFull(t));
function solvable(start){
  const key=t=>t.map(x=>x.join('')).sort().join('|');
  const seen=new Set([key(start)]),stack=[start];let n=0;
  while(stack.length&&n++<100000){
    const s=stack.pop();
    if(isSolved(s))return true;
    for(let i=0;i<s.length;i++)for(let j=0;j<s.length;j++){
      if(i===j||!canPour(s[i],s[j]))continue;
      if(!s[j].length&&s[i].every(x=>x===s[i][0]))continue;
      const nx=s.map(t=>t.slice());pour(nx,i,j);
      const k=key(nx);if(!seen.has(k)){seen.add(k);stack.push(nx);}
    }
  }
  return false;
}
function genPotions(){
  for(;;){
    const pool=[];
    for(let c=0;c<COLS.length;c++)for(let k=0;k<CAP;k++)pool.push(c);
    shuffle(pool);
    const tubes=COLS.map((_,i)=>pool.slice(i*CAP,(i+1)*CAP));
    tubes.push([],[]);
    if(tubes.some(isFull))continue;
    if(solvable(tubes))return tubes;
  }
}
function potions(){
  const init=genPotions();
  let tubes=JSON.parse(JSON.stringify(init)),sel=null,hist=[],over=false;
  const wrap=h('div','tubes');stage.appendChild(wrap);
  function draw(){
    wrap.textContent='';
    tubes.forEach((t,i)=>{
      const d=h('div','tube'+(sel===i?' sel':'')+(isFull(t)?' done':''));
      t.forEach(c=>{const s=h('div','seg',COLS[c].g);s.style.background=COLS[c].c;d.appendChild(s);});
      d.onclick=()=>tap(i);wrap.appendChild(d);
    });
  }
  function tap(i){
    if(over)return;
    if(sel===null){if(tubes[i].length){sel=i;sfx.tap();}}
    else if(sel===i){sel=null;}
    else if(canPour(tubes[sel],tubes[i])){
      hist.push(JSON.stringify(tubes));pour(tubes,sel,i);sel=null;sfx.pour();draw();
      if(isSolved(tubes)){over=true;setTimeout(complete,700);}
      return;
    }else if(tubes[i].length){sel=i;sfx.tap();}
    else{sel=null;sfx.bad();}
    draw();
  }
  btn('Undo',()=>{if(over||!hist.length)return;tubes=JSON.parse(hist.pop());sel=null;draw();});
  btn('Start over',()=>{if(over)return;tubes=JSON.parse(JSON.stringify(init));hist=[];sel=null;draw();});
  draw();
}

/* ---------- level 2: runes ---------- */
const RN=4;
const GLYPHS=['M12 3v18M12 8l6-4M12 13l6-4','M7 3v18M7 3l9 6-9 6','M17 4L6 12l11 8','M12 21V3M6 9l6-6 6 6','M7 3v18M17 3v18M7 8l10 8','M12 3l7 9-7 9-7-9z'];
function flip(b,i){
  const x=i%RN,y=(i/RN)|0;
  [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
    const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<RN&&ny>=0&&ny<RN)b[ny*RN+nx]=!b[ny*RN+nx];
  });
}
function genRunes(){
  for(;;){
    const sol=shuffle([...Array(RN*RN).keys()]).slice(0,5);
    const board=Array(RN*RN).fill(true);
    sol.forEach(i=>flip(board,i));
    if(board.filter(x=>!x).length>=4)return{board,sol};
  }
}
function runes(){
  const g=genRunes(),board=g.board,need=new Set(g.sol);
  let over=false,hint=-1;
  const grid=h('div','runes');stage.appendChild(grid);
  function draw(){
    grid.textContent='';
    board.forEach((on,i)=>{
      const d=h('div','rune'+(on?' on':'')+(hint===i?' hint':''));
      d.innerHTML=`<svg viewBox="0 0 24 24"><path d="${GLYPHS[(i*5+(i>>2))%GLYPHS.length]}"/></svg>`;
      d.onclick=()=>press(i);grid.appendChild(d);
    });
  }
  function press(i){
    if(over)return;
    flip(board,i);hint=-1;
    if(need.has(i))need.delete(i);else need.add(i);
    sfx.tap();draw();
    if(board.every(Boolean)){over=true;setTimeout(complete,700);}
  }
  btn('Hint',()=>{
    if(over||!need.size)return;
    hint=[...need][0];draw();
  });
  draw();
}

/* ---------- level 3: riddles ---------- */
const RIDDLES=[
  {q:'I have scales and wings, I breathe fire, and I sleep on a pile of gold. What am I?',a:'DRAGON'},
  {q:'I have a mouth but never speak, and a bed but never sleep. What am I?',a:'RIVER'},
  {q:'The more of me there is, the less you can see. What am I?',a:'DARKNESS'},
  {q:'I am tall in the morning, short at noon, and long again at night. I stay glued to your feet. What am I?',a:'SHADOW'},
  {q:'I speak without a mouth and hear without ears. I only answer when you call. What am I?',a:'ECHO'},
  {q:'I am tall when I am young and short when I am old. I give light, and a puff of breath can end me. What am I?',a:'CANDLE'},
  {q:'I have no voice, but I copy your face and every move you make. What am I?',a:'MIRROR'},
  {q:'I am smooth and white with no door or window, but a golden treasure hides inside me. What am I?',a:'EGG'},
  {q:'I fall from the sky in winter, I am soft and white, and I melt in your hand. What am I?',a:'SNOW'},
  {q:'I have towns and rivers but no people and no water. What am I?',a:'MAP'},
  {q:'I am small and made of metal. I have teeth but I cannot bite. I open doors. What am I?',a:'KEY'},
  {q:'I have a spine but no bones, and pages but no wings. Wizards keep their spells in me. What am I?',a:'BOOK'},
  {q:'I twinkle high above at night, and wizards make wishes on me. What am I?',a:'STAR'},
  {q:'I change my shape every night, from a thin curve to a big round face, and I light up the dark. What am I?',a:'MOON'},
  {q:'I am not alive, but I grow. I have no lungs, but I need air. Water is my enemy. What am I?',a:'FIRE'},
  {q:'You cannot see me, but you can see what I do. I make leaves dance and fill the sails of ships. What am I?',a:'WIND'},
  {q:'I appear after the rain with seven colours, and nobody has ever reached my end. What am I?',a:'RAINBOW'},
  {q:'A king wears me on his head. I am made of gold and shiny jewels. What am I?',a:'CROWN'},
  {q:'I have a trunk but I am not an elephant, and leaves but I am not a book. Birds make their homes in me. What am I?',a:'TREE'},
  {q:'I am a see-through spirit who haunts old castles and floats through walls. What am I?',a:'GHOST'},
  {q:'I have hands but cannot clap, and a face but cannot smile. What am I?',a:'CLOCK'},
  {q:'I help you cross a river without getting wet, and I stand strong without any legs. What am I?',a:'BRIDGE'}
];
function pickRiddles(){
  /* three riddles per run, avoiding ones seen recently */
  let seen=store.get('wt_seen',[]);
  let fresh=RIDDLES.filter(r=>!seen.includes(r.a));
  if(fresh.length<3){seen=[];fresh=RIDDLES.slice();}
  const pick=shuffle(fresh).slice(0,3);
  store.set('wt_seen',seen.concat(pick.map(r=>r.a)));
  return pick;
}
const DOOR=`<svg id="door" viewBox="0 0 120 124" role="img" aria-label="Magic door">
<defs><radialGradient id="gl"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ff9a3c"/></radialGradient>
<clipPath id="arch"><path d="M24 118V54a36 36 0 0 1 72 0v64z"/></clipPath></defs>
<path d="M16 118V52a44 44 0 0 1 88 0v66z" fill="#2a2858" stroke="#8e89d6" stroke-width="3"/>
<g clip-path="url(#arch)">
<rect id="glow" x="24" y="10" width="72" height="108" fill="url(#gl)"/>
<g id="pl" class="panel"><path d="M24 118V54a36 36 0 0 1 36-36v100z" fill="#5b3a1e" stroke="#2d1a0a" stroke-width="2"/></g>
<g id="pr" class="panel"><path d="M96 118V54a36 36 0 0 0-36-36v100z" fill="#6b4524" stroke="#2d1a0a" stroke-width="2"/></g>
</g>
<g stroke="#2d1a0a" stroke-width="1.5"><circle id="g0" cx="42" cy="46" r="6" fill="#444"/><circle id="g1" cx="60" cy="38" r="6" fill="#444"/><circle id="g2" cx="78" cy="46" r="6" fill="#444"/></g>
</svg>`;
function riddles(){
  const set=pickRiddles();
  let r=0,slots,tiles,busy=false;
  const holder=h('div');holder.innerHTML=DOOR;stage.appendChild(holder);
  const door=holder.firstChild;
  const q=h('p','riddle'),sl=h('div','slots'),tl=h('div','tiles');
  stage.append(q,sl,tl);
  function load(){
    const a=set[r].a;
    slots=Array(a.length).fill(null);
    const extras=shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c=>!a.includes(c))).slice(0,3);
    tiles=shuffle([...a.split(''),...extras]).map((ch,id)=>({ch,id,used:false}));
    draw();
  }
  function draw(){
    q.innerHTML='';q.append(h('small','',`Riddle ${r+1} of 3`),set[r].q);
    sl.textContent='';tl.textContent='';
    slots.forEach((s,p)=>{
      const d=h('div','slot'+(s&&s.locked?' locked':'')+(s&&s.ok?' ok':''),s?tiles[s.id].ch:'');
      d.onclick=()=>remove(p);sl.appendChild(d);
    });
    tiles.forEach(t=>{
      const d=h('div','tile'+(t.used?' used':''),t.ch);
      d.onclick=()=>place(t.id);tl.appendChild(d);
    });
    gems();
  }
  function gems(){for(let i=0;i<3;i++)door.querySelector('#g'+i).setAttribute('fill',i<r?'#ffd23f':'#444');}
  function place(id){
    const p=slots.findIndex(s=>!s);
    if(busy||p<0||tiles[id].used)return;
    slots[p]={id,locked:false};tiles[id].used=true;sfx.tap();draw();
    if(slots.every(Boolean))check();
  }
  function remove(p){
    const s=slots[p];
    if(busy||!s||s.locked)return;
    tiles[s.id].used=false;slots[p]=null;sfx.tap();draw();
  }
  function check(){
    const a=set[r].a;
    busy=true;
    if(slots.map(s=>tiles[s.id].ch).join('')===a){
      sfx.good();slots.forEach(s=>s.ok=true);draw();
      setTimeout(()=>{
        r++;
        if(r===3){gems();door.classList.add('open');setTimeout(complete,1400);}
        else{load();busy=false;}
      },900);
    }else{
      sfx.bad();sl.classList.add('shake');
      setTimeout(()=>{
        sl.classList.remove('shake');
        slots.forEach((s,p)=>{if(s&&!s.locked){tiles[s.id].used=false;slots[p]=null;}});
        busy=false;draw();
      },550);
    }
  }
  function hintFn(){
    if(busy)return;
    const a=set[r].a;
    const p=slots.findIndex((s,i)=>!s||tiles[s.id].ch!==a[i]);
    if(p<0)return;
    if(slots[p]){tiles[slots[p].id].used=false;slots[p]=null;}
    let t=tiles.find(t=>!t.used&&t.ch===a[p]);
    if(!t){
      const q2=slots.findIndex(s=>s&&tiles[s.id].ch===a[p]&&!s.locked);
      t=tiles[slots[q2].id];tiles[t.id].used=false;slots[q2]=null;
    }
    slots[p]={id:t.id,locked:true};t.used=true;sfx.tap();draw();
    if(slots.every(Boolean))check();
  }
  btn('Hint',hintFn);
  btn('Clear',()=>{
    if(busy)return;
    slots.forEach((s,p)=>{if(s&&!s.locked){tiles[s.id].used=false;slots[p]=null;}});draw();
  });
  keyHandler=e=>{
    if(busy)return;
    if(e.key==='Backspace'){for(let p=slots.length-1;p>=0;p--)if(slots[p]&&!slots[p].locked){remove(p);break;}}
    else if(/^[a-z]$/i.test(e.key)){const t=tiles.find(t=>!t.used&&t.ch===e.key.toUpperCase());if(t)place(t.id);}
  };
  load();
}

/* ---------- slide puzzle ---------- */
function slide(){
  const N=3,gapAt=N*N-1;
  let b=[...Array(N*N).keys()].map(i=>i+1);b[gapAt]=0;
  let g=gapAt,prev=-1;
  for(let k=0;k<80;k++){
    const x=g%N,y=(g/N)|0,opts=[];
    if(x>0)opts.push(g-1);if(x<N-1)opts.push(g+1);if(y>0)opts.push(g-N);if(y<N-1)opts.push(g+N);
    const o=opts.filter(i=>i!==prev),n=o[rnd(o.length)];
    b[g]=b[n];b[n]=0;prev=g;g=n;
  }
  if(b.every((v,i)=>v===(i+1)%(N*N)))return slide();
  let over=false;
  const grid=h('div','slide');stage.appendChild(grid);
  function draw(){
    grid.textContent='';
    b.forEach((v,i)=>{
      const d=h('div','stone'+(v?'':' gap')+(v&&v===i+1?' ok':''),v||'');
      d.onclick=()=>tap(i);grid.appendChild(d);
    });
  }
  function tap(i){
    if(over)return;
    const e=b.indexOf(0),x=i%N,y=(i/N)|0,ex=e%N,ey=(e/N)|0;
    if(i===e||(x!==ex&&y!==ey)){sfx.bad();return;}
    const step=x===ex?(y<ey?N:-N):(x<ex?1:-1);
    for(let c=e;c!==i;c-=step)b[c]=b[c-step];
    b[i]=0;sfx.pour();draw();
    if(b.every((v,k)=>v===(k+1)%(N*N))){over=true;setTimeout(complete,700);}
  }
  draw();
}

/* ---------- memory match ---------- */
function memory(){
  const SYM=['★','☾','☀','♦','♣','♠','♥','✿','♫','✦'],COL=['#b8325f','#3e6fd8','#c77a00','#2a7a3a','#7a3fb8','#c4382f'];
  const pick=shuffle(SYM.slice()).slice(0,6);
  const cards=shuffle(pick.concat(pick).map((s,i)=>({s,c:COL[pick.indexOf(s)%COL.length],st:0})));
  let first=-1,lock=false,found=0;
  const grid=h('div','mem');stage.appendChild(grid);
  function draw(){
    grid.textContent='';
    cards.forEach((c,i)=>{
      const d=h('div','mcard'+(c.st===1?' up':c.st===2?' done':''),c.s);
      d.style.setProperty('--c',c.c);d.onclick=()=>tap(i);grid.appendChild(d);
    });
  }
  function tap(i){
    if(lock||cards[i].st)return;
    cards[i].st=1;sfx.tap();
    if(first<0){first=i;draw();return;}
    const a=first;first=-1;draw();
    if(cards[a].s===cards[i].s){
      cards[a].st=cards[i].st=2;found++;sfx.good();
      setTimeout(draw,350);
      if(found===6)setTimeout(complete,900);
    }else{
      lock=true;
      setTimeout(()=>{cards[a].st=cards[i].st=0;lock=false;draw();},800);
    }
  }
  draw();
}

/* ---------- crystal choir (Simon) ---------- */
function crystals(){
  const ep=epoch,C=['#e5484d','#3e8ef7','#3fbf6a','#f5c542'],G=['●','▲','■','★'],F=[262,330,392,523],LEN=5;
  const seq=Array.from({length:LEN},()=>rnd(4));
  let round=1,pos=0,input=false,over=false;
  const st=h('p','status'),grid=h('div','crys');stage.append(st,grid);
  const el=C.map((c,k)=>{
    const d=h('div','crystal',G[k]);d.style.background=c;d.style.setProperty('--c',c);
    d.onclick=()=>press(k);grid.appendChild(d);return d;
  });
  const say=t=>{st.textContent=t;};
  function flash(k){
    el[k].classList.add('lit');tone(F[k],.4,'sine',0,.12);
    setTimeout(()=>el[k].classList.remove('lit'),400);
  }
  function play(){
    if(ep!==epoch||over)return;
    input=false;say(`Round ${round} of ${LEN}: watch the crystals…`);
    let i=0;
    const step=()=>{
      if(ep!==epoch||over)return;
      if(i>=round){input=true;pos=0;say('Your turn! Copy the song.');return;}
      flash(seq[i++]);setTimeout(step,700);
    };
    setTimeout(step,800);
  }
  function press(k){
    if(!input||over)return;
    flash(k);
    if(k!==seq[pos]){input=false;sfx.bad();say('Oops! Watch again…');setTimeout(play,1200);return;}
    if(++pos===round){
      input=false;
      if(round===LEN){over=true;say('Perfect!');setTimeout(complete,700);}
      else{round++;say('Well done!');setTimeout(play,1000);}
    }
  }
  btn('Hear it again',()=>{if(input&&!over)play();});
  play();
}

/* ---------- mana pipes ---------- */
function pipes(){
  const W=4,H=4,N=1,E=2,S=4,WS=8;
  const D=[[0,-1,N],[1,0,E],[0,1,S],[-1,0,WS]];
  const opp=m=>((m<<2)|(m>>2))&15,rot=m=>((m<<1)|(m>>3))&15;
  let mask,r0,r1;
  function gen(){
    for(;;){
      r0=rnd(H);r1=rnd(H);
      const path=[[0,r0]],seen=new Set([r0*W]);
      const dfs=(x,y)=>{
        if(x===W-1&&y===r1)return true;
        for(const [dx,dy] of shuffle(D.slice())){
          const nx=x+dx,ny=y+dy,k=ny*W+nx;
          if(nx<0||nx>=W||ny<0||ny>=H||seen.has(k))continue;
          seen.add(k);path.push([nx,ny]);
          if(dfs(nx,ny))return true;
          path.pop();seen.delete(k);
        }
        return false;
      };
      if(!dfs(0,r0)||path.length<7)continue;
      const m=Array(W*H).fill(0);
      for(let i=0;i<m.length;i++)m[i]=[5,10,3,6,12,9,3,6,12,9][rnd(10)];
      path.forEach(([x,y],i)=>{
        const dir=(a,b)=>D.find(d=>d[0]===b[0]-a[0]&&d[1]===b[1]-a[1])[2];
        let v=0;
        v|=i===0?WS:dir([x,y],path[i-1]);
        v|=i===path.length-1?E:dir([x,y],path[i+1]);
        m[y*W+x]=v;
      });
      for(let i=0;i<m.length;i++)for(let k=rnd(4);k>0;k--)m[i]=rot(m[i]);
      mask=m;
      if(!reach().ok)return;
    }
  }
  function reach(){
    const lit=new Set(),s0=r0*W;
    if(!(mask[s0]&WS))return{lit,ok:false};
    const st=[s0];lit.add(s0);
    while(st.length){
      const c=st.pop(),x=c%W,y=(c/W)|0;
      for(const [dx,dy,bit] of D){
        const nx=x+dx,ny=y+dy,n=ny*W+nx;
        if(nx<0||nx>=W||ny<0||ny>=H||lit.has(n))continue;
        if((mask[c]&bit)&&(mask[n]&opp(bit))){lit.add(n);st.push(n);}
      }
    }
    const gl=r1*W+W-1;
    return{lit,ok:lit.has(gl)&&!!(mask[gl]&E)};
  }
  gen();
  const wrap=h('div','pipes');wrap.style.gridTemplateColumns=`repeat(${W+2},1fr)`;stage.appendChild(wrap);
  const cells=[],ends=[];
  function pathFor(m){
    let d='';
    if(m&N)d+='M50 50V0';if(m&E)d+='M50 50H100';if(m&S)d+='M50 50V100';if(m&WS)d+='M50 50H0';
    return d;
  }
  for(let y=0;y<H;y++){
    for(let x=-1;x<=W;x++){
      if(x===-1||x===W){
        const isSrc=x===-1&&y===r0,isGoal=x===W&&y===r1;
        const d=h('div','pend',isSrc?'★':isGoal?'◆':'');
        wrap.appendChild(d);
        if(isSrc)ends[0]=d;if(isGoal)ends[1]=d;
        continue;
      }
      const i=y*W+x,d=h('div','pcell');
      d.innerHTML=`<svg viewBox="0 0 100 100"><path d="${pathFor(mask[i])}"/><circle cx="50" cy="50" r="11" fill="currentColor" stroke="none"/></svg>`;
      d.onclick=()=>tap(i);wrap.appendChild(d);cells[i]={d,rot:0};
    }
  }
  let over=false;
  function paint(){
    const r=reach();
    cells.forEach((c,i)=>c.d.classList.toggle('lit',r.lit.has(i)));
    ends[0].classList.add('lit');
    ends[1].classList.toggle('lit',r.ok);
    return r.ok;
  }
  function tap(i){
    if(over)return;
    mask[i]=rot(mask[i]);cells[i].rot+=90;
    cells[i].d.firstChild.style.transform=`rotate(${cells[i].rot}deg)`;
    sfx.tap();
    if(paint()){over=true;setTimeout(complete,900);}
  }
  paint();
}
